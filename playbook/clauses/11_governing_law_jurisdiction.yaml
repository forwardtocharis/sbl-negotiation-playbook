    url: "https://links.imagerelay.com/cdn/2958/ql/lombard-loan-contract-sqbe-en-01072023"
    retrieved: 2026-09-21
    reliability: B
    verified: true
    note: "Published Lombard loan agreement template of a Luxembourg bank (CSSF-supervised). Supports the preferred and acceptable tiers and the Luxembourg note: the governing-law clause chooses Luxembourg law and names the Law of 5 August 2005 as the statute relied on; Luxembourg is the sole place of performance, the place of debt collection for clients domiciled abroad and the sole place of jurisdiction; the bank nonetheless reserves the right to sue at the client's domicile or before any other competent authority, in which case Luxembourg law still applies exclusively; and the whole clause is expressly subject to mandatory conflicts rules."
