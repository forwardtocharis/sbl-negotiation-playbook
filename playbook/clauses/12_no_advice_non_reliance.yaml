    note: "Composite exhibit, EDGAR accession 0000950123-08-001840, of three private-bank securities-lending documents given by individual and trust pledgors. Supports the preferred and acceptable tiers: sub-part C is the tightest non-reliance wording in the pool, the grantor entering on its own independent analysis and not relying on any statement or representation by the bank as to the borrower, the loan, the credit documents, the collateral, its value or condition or any other matter; sub-part B carries the three-limb sophisticated-investor representation (knowledge and experience of margin lending and the relevant instruments; access to and knowledge of appropriate analytical tools to evaluate the collateral and its effect on the overall portfolio; sufficient financial resources and liquidity to bear all the risks including loss of the entire principal); sub-part A supports the acceptable tier's conflict structure, acknowledging that the dual role of creditor and discretionary manager could give rise to a conflict of interest and consenting to it, which is a consent structure rather than a disclaimer."
