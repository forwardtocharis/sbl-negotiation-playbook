    note: "Published Lombard loan agreement template of a Luxembourg bank (CSSF-supervised). Supports the preferred tier and the Luxembourg note: it points at a published investment and risk warning notice and a separate risk disclosure for the more volatile asset classes, takes a representation that the client has read and accepted them and is aware of the risks, repeated at all times until termination, and carries a 14 calendar day withdrawal right for a retail client under a distance contract where the facility has not been used."
