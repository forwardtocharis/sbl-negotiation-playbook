    reliability: A
    verified: true
    note: "Luxembourg Law of 5 August 2005 on financial collateral arrangements, consolidated text published by the regulator (updated 15 July 2024); arts. 3-5, 11, 12, 13, 13-1, 18-20 and 22 were read by the sourcing agent. Supports the Luxembourg jurisdiction note: art. 11(1)(e)-(f) pricing routes on appropriation."
  - ref: "LAW-EW-01"
