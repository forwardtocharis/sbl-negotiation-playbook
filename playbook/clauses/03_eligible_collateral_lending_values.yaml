# Draft entry (WP3, drafting group B). Lender-side. Synthetic demonstrator.
# Nothing here is legal advice. Numbers that are judgement calls are written as
# X, with the observed range and source refs in the comment above the field.
# Deliberate gap: no source opened for this playbook publishes a lending-value
# grid by asset class, so this entry describes the mechanism and never states a
# grid. See docs/research/clause_sources.md, "Lending value by asset class".
id: eligible_collateral_lending_values
title: "Eligible collateral and lending values by asset class"
category: collateral
document: facility_letter
risk_rating: high
lender_objective: >
  Keep the Bank in control of which assets count as collateral and at what advance rate, so that
  the facility is sized against assets the Bank can price and sell rather than against whatever the
  Borrower happens to hold.
counterparty_asks:
  - A contractual lending-value grid by asset class that the Bank cannot change unilaterally.
  - Appraisal rights and a dispute mechanism over the Bank's valuation where a pledged asset is not exchange-listed.
  - A good-faith or commercial-reasonableness qualifier on the Bank's calculation of lending value.
  - Notice of a change in lending value percentages before it bites, rather than after it has taken effect.
  - Admission of a specific illiquid, unlisted or restricted holding to the eligible schedule at a positive lending value.
  - Removal of the currency haircut where the Borrower says it will manage the currency exposure itself.
positions:
  preferred:
    # observed: no source opened publishes an advance-rate grid by asset class. Drivers only
    # (BANK-LU-01: percentage of collateral value, nature of the assets, volatility, liquidity,
    # diversification; BANK-CH-01: type, currency, quality, volatility, marketability,
    # diversification, reviewed at regular intervals). One hard number exists in the pool: a 50%
    # lending value percentage changeable at the bank's sole and absolute discretion (EDGAR-PB-01-B).
    # The currency haircut of X percentage points is a [VERIFY] judgement number: no opened source
    # publishes a currency-haircut figure.
    text: >
      Eligible collateral is limited to the asset classes listed in the Eligible Collateral Schedule to
      this facility letter. The lending value of a pledged asset is the market value of that asset as
      determined by the Bank multiplied by the lending value percentage the Bank applies to the relevant
      asset class from time to time, and the Bank may apply a different percentage to an individual
      holding. An asset that is not listed in the Eligible Collateral Schedule has a lending value of
      nil, and each of the following has a lending value of nil whether or not its asset class is listed:
      any security subject to a transfer restriction, lock-up, escrow arrangement or issuer consent
      requirement; any unlisted security or other asset for which the Bank does not have a pricing source
      it considers reliable; any interest in a fund whose redemptions are suspended, gated, deferred or
      side-pocketed; and any security suspended from trading or subject to a market-wide or
      issuer-specific trading restriction. Where a pledged asset is denominated in a currency other than
      the currency of the facility, its lending value is reduced by a further X percentage points to
      reflect currency risk. The Bank may amend the Eligible Collateral Schedule and any lending value
      percentage in accordance with the lender discretion clause of this facility letter.
    rationale: >
      This is the clause that decides how much money leaves the building against a given portfolio, so
      the Bank keeps both halves of the calculation: what counts as collateral, and at what rate. Every
      published bank document opened for this playbook states the lending value as a bank-set percentage
      of a bank-determined value and reserves the right to change it. The exclusions are not decoration:
      an asset the Bank cannot price, or cannot sell on the day it needs to sell, has no lending value
      whatever its screen price, and the Swiss regulator's stated concern about Lombard books is that
      haircuts are set too low, not too high. The currency haircut is there because an exchange-rate move
      can exhaust the cover without the securities moving at all.
    conditions: []
  acceptable:
    # observed: a good-faith qualifier on the calculation of lending value is conceded in a published
    # Luxembourg bank template (BANK-LU-01); lending values "reviewed at regular intervals" in a
    # published Swiss factsheet (BANK-CH-01); exchange-listed stock marked to market, often daily
    # (FIRM-01). Review interval X: no opened source states a fixed interval, so X is a judgement number.
    text: >
      Eligible collateral is limited to the asset classes listed in the Eligible Collateral Schedule. The
      Bank calculates the lending value of each pledged asset acting in good faith, as the market value of
      that asset multiplied by the lending value percentage applying to the relevant asset class, using
      prices taken from the pricing sources identified in the Schedule or, where no such price is
      available, a price determined by the Bank acting in good faith. The Bank reviews lending value
      percentages at intervals of not less than X and, on request, tells the Borrower the percentages then
      applying; the Bank notifies the Borrower of a change as soon as reasonably practicable after it
      takes effect. Assets excluded under the preferred position remain of nil lending value, and the
      currency haircut applies in accordance with the haircut matrix set out in the Schedule.
    rationale: >
      Conceding good faith and a named pricing source costs the Bank nothing it wants to keep. It is
      already how the calculation is done operationally, and a published retail Lombard template in the
      source pool concedes exactly this. What the Bank keeps is the percentage itself and the exclusions,
      which is where the credit protection sits. Publishing the haircut matrix also gives the relationship
      manager something to point at instead of an argument, which is worth more than the flexibility it
      gives up.
    conditions: []
  fallback:
    # observed: no opened source concedes a fixed grid. The closest concession in the pool is 15 days'
    # prior written notice of a change to the margin requirement, collapsing to immediate effect where
    # the change is required by law or the collateral value is rapidly diminishing (EDGAR-PB-01-B);
    # appraisal and dispute rights over valuation are conceded only for non-exchange-listed collateral
    # in some private-company margin loans (FIRM-01). The fixing period (X months), the notice period
    # (X business days) and the appraisal frequency (X months) are all [VERIFY] judgement numbers.
    text: >
      The lending value percentages applying to the holdings identified in Part 1 of the Eligible
      Collateral Schedule are fixed for X months from the date of this facility letter, and within that
      period the Bank may change them only on X business days' prior written notice, except where the
      change is required by law or regulation, where the asset has ceased to be eligible under the
      exclusions in this clause, or where the Bank determines that the market value of the relevant asset
      class is declining rapidly, in each of which cases the change takes effect immediately. Where a
      pledged asset is not exchange-listed and is valued by reference to a net asset value or other value
      reported by or on behalf of the issuer, the Borrower may, once in any X month period and at its own
      cost, require the Bank to obtain a valuation from an independent valuer appointed by the Bank; the
      Bank will take that valuation into account, and the Bank's determination following it is final. All
      other lending value percentages, and the Eligible Collateral Schedule itself, remain amendable by
      the Bank at any time.
    rationale: >
      This is the furthest the Bank should go, and because it is a real concession it is fenced. Fixing a
      percentage for a named holding for a stated period turns a risk-management tool into a commercial
      term, which is only tolerable where the collateral is liquid, diversified and priced by the market
      rather than by the issuer. The carve-outs are the price of the concession: a fixed percentage cannot
      survive a change in law, an asset becoming ineligible, or a rapid decline, because those are the
      moments the percentage exists for. The appraisal right is capped at one valuation a period, at the
      Borrower's cost, with the Bank appointing the valuer and keeping the final determination, so it
      informs the decision without transferring it.
    conditions:
      - Collateral is limited to exchange-listed securities, daily-dealt funds and cash.
      - No holding in Part 1 of the Schedule is a restricted, locked-up or control security.
      - Single-name exposure is within the concentration limit set for the facility.
      - The Bank or a member of its group is the Custodian, or an executed account control agreement is in place.
      - Credit has priced both the fixed percentages and the length of the fixing period.
    approval: head of credit
  unacceptable:
    text: >
      The Bank will not agree a lending-value grid fixed for the life of the facility or amendable only
      with the Borrower's consent; will not give a positive lending value to unlisted securities, gated or
      suspended fund interests, restricted or locked-up stock, or any asset it cannot price from a source
      it has chosen; will not accept a valuation supplied by the Borrower, by the issuer, or by a valuer
      appointed by the Borrower as binding on it; will not remove the currency haircut where the facility
      currency and a collateral currency differ; and will not accept a term under which an asset stays
      eligible after it has become subject to a transfer restriction or a trading suspension.
    rationale: >
      Each of these moves the lending value from being the Bank's own measure of risk to being something
      the Borrower or a third party controls, and once that happens the clause has no purpose left. The
      exclusions in particular are the difference between a secured facility and an unsecured one: an
      asset that cannot be sold inside the cure period is not collateral. Conceding a borrower-supplied
      valuation would also leave the Bank arguing about price at exactly the moment it needs to sell,
      which is the position every enforcement provision in this playbook is written to avoid.
default_floor: fallback
escalation_triggers:
  # observed: no opened source concedes a fixed grid at all (BANK-LU-01, BANK-US-01 and EDGAR-PB-01-A
  # each reserve the right to change), so X months here is the institution's own tolerance rather than
  # a market number.
  - Any request to fix lending value percentages for longer than X months, or for the life of the facility.
  - Any request to admit unlisted, gated, suspended, restricted or locked-up assets to the Eligible Collateral Schedule at a positive lending value.
  - Any request for a valuation supplied or appointed by the Borrower to bind the Bank.
  - Any bespoke lending value percentage above the Bank's standard percentage for that asset class.
  - Any request to remove the currency haircut where the facility currency and a collateral currency differ.
depends_on:
  - concentration_limits
  - lender_discretion_valuation
  - margin_maintenance_cure
  - currency_mismatch_fx
  - collateral_substitution
regulatory_flags:
  - restricted_securities
  - prudential_awareness
not_automated:
  - Whether a specific holding is admitted to the Eligible Collateral Schedule, and at what lending value percentage.
  - Setting the numeric grid itself. The demonstrator carries X placeholders because no public source opened for this playbook publishes one.
  - Whether an asset that becomes illiquid or restricted after drawdown is re-rated immediately or on notice.
  - Whether to take a concentrated but high-quality single holding at a reduced lending value rather than excluding it.
jurisdiction_notes:
  england_wales: >
    Draw the eligibility schedule so that everything in it can in fact be brought within the Bank's
    possession or control, because the financial collateral regime turns on that and on the collateral
    being cash, financial instruments or credit claims (LAW-EW-01). Assets that cannot be held in the
    controlled account, or that sit outside those categories, are outside the regime however comfortable
    the Bank is with them commercially. The regime also requires both the collateral-provider and the
    collateral-taker to be non-natural persons, so where the Pledgor is an individual the eligibility
    schedule is doing work the statutory regime will not back up.
  switzerland: >
    The published Swiss drivers of lending value are the type, currency, quality, volatility and
    marketability of the securities plus the diversification of the portfolio, with the ratio reviewed at
    regular intervals rather than fixed at drawdown (BANK-CH-01). The Swiss regulator's risk monitors name
    concentrated and illiquid Lombard collateral as a supervisory focus and say in terms that applied
    haircuts may be too low (REG-CH-01, REG-CH-02), so on a Swiss booking expect the schedule and the
    percentages to be challenged upward rather than downward.
  luxembourg: >
    Draw the eligibility schedule against the statutory exit routes: listed instruments can be
    appropriated at market price, and fund units at the last published net asset value provided it is less
    than a year old, or at the fund's redemption price (LAW-LU-01, art. 11(1)(e)-(f)). Collateral that
    cannot be priced by one of those routes has no fast exit under Luxembourg law, which is a direct
    argument for giving it a nil lending value rather than a low one.
sources:
  - ref: "BANK-LU-01"
    type: bank_terms
    url: "https://links.imagerelay.com/cdn/2958/ql/lombard-loan-contract-sqbe-en-01072023"
    retrieved: 2026-09-21
    reliability: B
    verified: true
    note: "Published Lombard loan agreement template of a Luxembourg bank (CSSF-supervised). Supports: lending value is market value of eligible pledged assets minus the bank's haircut, calculated by the bank acting in good faith; the Limit is set on a percentage of collateral value, the nature of the assets, their risk profile (volatility and liquidity) and the level of diversification."
  - ref: "BANK-CH-01"
    type: bank_terms
    url: "https://www.ubs.com/content/dam/assets/microsites/credit-suisse/static/doc/lombardkredit-factsheet-en.pdf"
    retrieved: 2026-09-21
    reliability: B
    verified: true
    note: "Published Lombard loan product factsheet of a Swiss bank. Supports: the fullest published list of lending-value drivers (type, currency, quality, volatility and marketability, plus portfolio diversification) and that the ratio is reviewed at regular intervals. Marketing material, and says so."
  - ref: "EDGAR-PB-01"
    type: filed_agreement
    url: "https://www.sec.gov/Archives/edgar/data/1293153/000095012308001840/y49893exv99w7w05.htm"
    retrieved: 2026-09-21
    reliability: B
    verified: true
    note: "Composite exhibit, EDGAR accession 0000950123-08-001840, of three private-bank securities-lending documents given by individual and trust pledgors. Supports: lending value as a bank-set percentage per class of a bank-determined fair market value (sub-part A), and a 50% lending value percentage on margin collateral, changeable at the bank's sole and absolute discretion (sub-part B). The only filed source in the pool with unredacted lending values."
  - ref: "FIRM-01"
    type: law_firm_briefing
    url: "https://www.stblaw.com/docs/default-source/related-link-pdfs/global-legal-insights-fund-finance-2022_backleverage-financings--insights-into-the-margin-loan.pdf?sfvrsn=b1f56e21_2"
    retrieved: 2026-09-21
    reliability: C
    verified: true
    note: "Practitioner-guide chapter on margin loan / backleverage financings. Supports: valuation method follows collateral type, with exchange-listed stock marked to market (often daily) and private-company collateral valued off sponsor-reported value with negotiated appraisal and sometimes dispute rights."
  - ref: "REG-CH-01"
    type: regulator
    url: "https://www.finma.ch/en/~/media/finma/dokumente/dokumentencenter/myfinma/finma-publikationen/risikomonitor/20241118-finma-risikomonitor-2024.pdf"
    retrieved: 2026-09-21
    reliability: A
    verified: true
    note: "Swiss regulator risk monitor 2024. Supports: supervisory focus on concentrated and more illiquid Lombard collateral, and the explicit concern that applied haircuts may be too low."
  - ref: "REG-CH-02"
    type: regulator
    url: "https://www.finma.ch/en/~/media/finma/dokumente/dokumentencenter/myfinma/finma-publikationen/risikomonitor/20251117-finma-risikomonitor-2025.pdf?sc_lang=en"
    retrieved: 2026-09-21
    reliability: A
    verified: true
    note: "Swiss regulator risk monitor 2025. Supports: the sharpened position naming single-stock lending, undiversified collateral and correlated exposure across banks lending against the same collateral."
  - ref: "LAW-LU-01"
    type: primary_law
    url: "https://www.cssf.lu/wp-content/uploads/L_050805_fin_coll_upd_15072024.pdf"
