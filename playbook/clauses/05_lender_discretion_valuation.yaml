    reliability: B
    verified: true
    note: "Composite exhibit, EDGAR accession 0000950123-08-001840, of three private-bank securities-lending documents given by individual and trust pledgors. Supports both ends of this ladder: sub-part A allows the bank to change or eliminate the lending value percentage for any class at any time without prior notice; sub-part B is the only document in the pool conceding a notice period, at 15 days' prior written notice, collapsing to immediate effect where the change is required by applicable law or where the value of the collateral is rapidly diminishing."
  - ref: "EDGAR-ML-03"
