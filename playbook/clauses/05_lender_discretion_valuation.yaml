    type: bank_terms
    url: "https://links.imagerelay.com/cdn/2958/ql/lombard-loan-contract-sqbe-en-01072023"
    retrieved: 2026-09-21
    reliability: B
    verified: true
    note: "Published Lombard loan agreement template of a Luxembourg bank (CSSF-supervised). Supports the preferred tier: the bank may reduce the Limit at any time with no obligation to give notice, may amend haircuts at any time without notice (which may reduce or withdraw the Limit), and may reduce or withdraw with immediate effect where it considers the conditions on which the Limit was granted have changed, informing the client afterwards. Its single counterweight is that lending value is calculated acting in good faith."
  - ref: "BANK-US-01"
    type: bank_terms
    url: "https://www.privatebank.citibank.com/we-offer/margin-lending"
    retrieved: 2026-09-21
    reliability: B
    verified: true
    note: "Published securities-backed / margin lending disclosures of a global private bank. Supports the preferred tier: collateral marked to market daily, margin requirements may be increased at any time, and no advance written notice is required."
  - ref: "EDGAR-PB-01"
