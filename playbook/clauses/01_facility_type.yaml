    note: "Margin loan agreement over listed shares, EDGAR accession 0001193125-21-187800. Supports the fallback tier as the institutional counter-model: a term facility with a maturity date, committed advances on named funding dates, no demand feature, and an exhaustive negotiated list of mandatory prepayment events and events of default doing the work a demand right would otherwise do."
