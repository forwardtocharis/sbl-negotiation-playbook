    note: "Swiss practitioner note on margin calls under Swiss law and standard Lombard pledge terms. Supports the Switzerland note: standard clauses do permit liquidation without prior warning, but the bank owes duties of care and loyalty in liquidating, must be able to produce accounting documentation for the liquidation, and where it acts as discretionary manager or adviser may owe a duty to notify the client of a margin deficiency first."
