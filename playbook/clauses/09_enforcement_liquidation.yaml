    note: "Swiss Federal Intermediated Securities Act (SR 957.1), official English translation, read by the WP7 research agent. Supports the Switzerland note: art. 31(1) realisation by sale with set-off, or by appropriation where the value can be determined objectively; art. 31(2) the power is unaffected by debt enforcement, reorganisation or protective proceedings; art. 31(3) the custodian is neither bound nor entitled to verify the realisation conditions; art. 32(1) notice to the provider before realisation, waivable only by a custodian or a qualified investor; art. 5(d) the closed definition of qualified investor, which does not include a natural person."
