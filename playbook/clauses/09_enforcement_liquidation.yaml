    reliability: B
    verified: true
    note: "Composite exhibit, EDGAR accession 0000950123-08-001840, of three private-bank securities-lending documents given by individual and trust pledgors. Supplies the entire observed notice ladder used in the acceptable and fallback tiers: at least 5 business days' notice of a public sale or of the time after which a private sale is to be made, agreed in advance to be reasonable, but with no notice at all where the collateral threatens to decline speedily in value or is of a type customarily sold on a recognised market; 3 business days on the same basis in a second sub-document; 3 days in a third, together with a deeming provision treating the bank as having appropriated collateral equal to the obligations before it received notice of a seizure or regulatory-process event. Also: no obligation to sell after giving notice, and adjournment by announcement without further notice."
