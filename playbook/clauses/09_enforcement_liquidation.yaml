    note: "Practitioner overview of lending and taking security in Switzerland (law stated 1 May 2025), read by the WP7 research agent. Supports the Switzerland note's process point: private enforcement must be organised and documented to obtain the best price obtainable in the circumstances; assets with an objectively determinable market value may be bought in by the secured party at market value with set-off and the surplus returned; once bankruptcy is declared, private enforcement of pledges generally stops, while assets transferred by title transfer before opening stay outside the estate."
