    verified: true
    note: "Law-firm note on the 2022 English High Court decision on appropriation of collateral under the financial collateral regulations. Supports the acceptable tier's rationale and the England and Wales note: the valuation must follow the terms of the arrangement and in any event be conducted in a commercially reasonable manner judged objectively; the outcome need not be reasonable, only the manner; responsibility remains with the collateral-taker even where a third-party valuer is used; and a non-compliant valuation does not void the appropriation but permits the court to substitute a compliant one."
