    note: "Pledge and security agreement supporting a margin loan, EDGAR accession 0001104659-16-164555; the most detailed pre-agreed commercial-reasonableness build in the pool. Supports the preferred tier throughout: sale publicly or privately without demand or notice of intention except where applicable law forbids waiver; advance acknowledgements that the block exceeds what can be sold quickly on the exchange, that timing and manner may produce materially less, that there is no obligation to sell over time, that the secured party may sell immediately without seeking strategic buyers or a control premium notwithstanding a significant discount, that a customary bookbuild counts as a public sale, and that a good-faith private placement made because a public sale would raise securities-law issues is commercially reasonable; survival of deficiency liability; and a reduced duty of care."
  - ref: "EDGAR-PB-01"
    type: filed_agreement
