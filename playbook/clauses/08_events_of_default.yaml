    verified: true
    note: "Financial Collateral Arrangements (No. 2) Regulations 2003, reg. 3 (definitions). Supports the England and Wales note: a security financial collateral arrangement requires the collateral to be in the possession or under the control of the collateral taker and requires both the collateral provider and the collateral taker to be non-natural persons, so an individual pledgor falls outside the regime."
