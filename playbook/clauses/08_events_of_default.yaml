    verified: true
    note: "Composite exhibit, EDGAR accession 0000950123-08-001840, of three private-bank securities-lending documents given by individual and trust pledgors. Supports the preferred tier throughout: sub-part C carries a default population defined to reach the borrower, the pledgor, any other guarantor or collateral provider and any beneficial owner or settlor of any of them; death or incompetence of any of them; actual or threatened insolvency, business failure or material litigation; the actual or threatened effect of any law, regulation, order or decree; attachment, seizure, forfeiture, subpoena, court order or regulatory proceedings; and the bank deeming the collateral inadequate, impaired or insecure. Sub-part B supports the fallback tier's notice period before realisation on a change-of-law acceleration (10 calendar days) and records that the pledge is not terminated by the death or dissolution of the pledgor."
