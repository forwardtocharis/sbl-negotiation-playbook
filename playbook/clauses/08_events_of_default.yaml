    note: "Margin loan agreement over listed shares, EDGAR accession 0001193125-21-187800. Supports the acceptable and fallback tiers: non-payment of principal with no grace, of interest and fees with 1 business day grace (2 business days where the failure was purely administrative or operational), and of a margin call amount with no grace; cross-default above a threshold amount after any applicable grace; 30 days to cure a general covenant breach from the earlier of notice and a responsible officer's knowledge, except where the breach by its nature cannot be cured; involuntary insolvency proceedings undismissed for 30 days, with automatic acceleration on voluntary insolvency; the security ceasing to be a valid first-priority perfected interest; and illegality."
