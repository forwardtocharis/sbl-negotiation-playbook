    verified: true
    note: "Composite exhibit, EDGAR accession 0000950123-08-001840, of three private-bank securities-lending documents given by individual and trust pledgors. Supports the preferred tier's full-dominion position: the bank takes a security interest, pledge, lien, charge, assignment, hypothecation and right of set-off over everything in named accounts, asserts full dominion and control with no withdrawals permitted, releases only such excess as it decides taking loanable values, currency risk and tax into account, and states that the agreement creates a valid and perfected first fixed charge and first-priority security interest."
  - ref: "BANK-LU-03"
