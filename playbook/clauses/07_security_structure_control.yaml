    url: "https://www.sec.gov/Archives/edgar/data/1723128/000089843224000401/exh99-5.htm"
    retrieved: 2026-09-21
    reliability: B
    verified: true
    note: "Pledge and security agreement supporting a margin loan, EDGAR accession 0000898432-24-000401. Supports the pledgor covenants in the preferred tier: defend the collateral against adverse claims, never allow a financing statement naming anyone else as secured party, create no lien other than the lender's and permitted liens, and bear the costs of defending and enforcing the security interest. Also contains the lender-side beneficial-ownership cap and a power of attorney."
  - ref: "EDGAR-PB-01"
    type: filed_agreement
    url: "https://www.sec.gov/Archives/edgar/data/1293153/000095012308001840/y49893exv99w7w05.htm"
