    verified: true
    note: "Financial Collateral Arrangements (No. 2) Regulations 2003, reg. 3 (definitions), read by the WP7 research agent. Supports the England and Wales note on three points: security interest is defined to include pledge, mortgage, fixed charge, floating charge and lien; collateral counts as in the taker's possession where credited to an account in its name with the provider's rights limited to substituting collateral of equal or greater value or withdrawing excess; and both parties to a security or title transfer arrangement must be non-natural persons, a non-natural person excluding an individual. It does NOT support the statement of what is lost when the regime does not apply, which is marked [VERIFY] in that note."
  - ref: "LAW-EW-03"
    type: primary_law
    url: "https://www.legislation.gov.uk/uksi/2003/3226/regulation/4"
    retrieved: 2026-09-21
