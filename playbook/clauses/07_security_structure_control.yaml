    verified: true
    note: "Published general terms and conditions of a bank's Luxembourg branch. Supports the preferred tier's scope: by force of the general terms and the Law of 5 August 2005, everything entrusted by the client to the bank is pledged ipso jure for whatever the client owes now or in future, the bank cannot be compelled to release it, and the bank also holds a right of retention over the pledged collateral."
  - ref: "BANK-LU-01"
