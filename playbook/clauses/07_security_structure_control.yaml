    retrieved: 2026-09-21
    reliability: B
    verified: true
    note: "Pledge and security agreement together with a secured custodian securities account control agreement and a deposit account control agreement, EDGAR accession 0001140361-24-012544. Supports the acceptable tier: where the custodian is a depositary agent that is not the lender, the answer is control agreements over both the securities account and the deposit account, with the security expressed as a valid, perfected, first-priority interest in the accounts, in the financial assets credited to them, in the security entitlements and in the cash."
  - ref: "EDGAR-PL-01"
