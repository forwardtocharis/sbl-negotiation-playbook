    reliability: B
    verified: true
    note: "Pledge and security agreement supporting a margin loan, EDGAR accession 0001104659-16-164555; the fullest control build in the pool. Supports the preferred tier's control architecture (first-priority security interest plus set-off, a custodian acceptable to the secured party, segregated cash and share collateral accounts with sub-accounts, a tripartite control agreement, financing statements, re-registration into the custodian's name) and the two concessions in the acceptable tier (an express undertaking by the secured party not to rehypothecate, use, lend, pledge or sell except as permitted or consented to; and voting left with the pledgor until an event of default, with an irrevocable proxy flipping it on default)."
  - ref: "EDGAR-PL-03"
