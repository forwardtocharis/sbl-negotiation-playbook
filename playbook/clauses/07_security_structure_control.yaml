    verified: true
    note: "Financial Collateral Arrangements (No. 2) Regulations 2003, reg. 4, read by the WP7 research agent. Supports the England and Wales note's registration point: reg. 4(4) disapplies the Companies Act 2006 charge registration duty and the voidness consequence for a security financial collateral arrangement and any charge created or arising under one - which is why a failure of the arrangement to qualify also revives a registration duty whose time limit has by then expired."
  - ref: "LAW-CH-01"
