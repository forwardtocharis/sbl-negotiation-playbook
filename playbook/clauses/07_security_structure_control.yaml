    reliability: B
    verified: true
    note: "Published Lombard loan agreement template of a Luxembourg bank (CSSF-supervised). Supports the preferred tier's reach: the retail Lombard facility is pointed at the general deed of pledge in the bank's general terms, and the pledge covers the assets in all of the client's accounts, including joint accounts of which the client is one holder."
  - ref: "EDGAR-EN-01"
