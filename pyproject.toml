[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbl"
version = "0.1.0"
description = "SBL Negotiation Playbook Demonstrator (synthetic, non-production)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "pydantic>=2",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sbl = "sbl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
