# Golden deal D04 (build_plan.md §5). Entirely synthetic: Borrower D and the
# spouse pledgor are fictional and no real person or custodian is described.
#
# Shape: the third-party security run. An individual borrower in Luxembourg
# with no high-net-worth or business-purpose declaration on file, whose spouse
# provides the collateral, held at a third-party Luxembourg custodian.
deal_id: D04
